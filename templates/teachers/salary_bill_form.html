{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Edit Salary Bill | {{ bill.teacher.full_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm">
      <div class="card-header bg-white py-3">
        <h5 class="fw-bold mb-0 text-success">
          <i class="fas fa-edit me-2"></i> Edit Salary Bill: {{ bill.teacher.full_name }} ({{ bill.month_name }} {{ bill.year }})
        </h5>
      </div>
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <div class="mt-4 pt-3 border-top d-flex justify-content-end gap-2">
            <a href="{% url 'salary_bill_list' %}" class="btn btn-light border">Cancel</a>
            <button type="submit" class="btn btn-success fw-bold">
              <i class="fas fa-save me-1"></i> Update Salary Bill
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
