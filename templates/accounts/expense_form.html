{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Record Expense{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm border-warning">
      <div class="card-header bg-warning text-dark py-3">
        <h5 class="fw-bold mb-0">
          <i class="fas fa-minus-circle me-2"></i> Record Operational School Expense
        </h5>
      </div>
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <div class="mt-4 pt-3 border-top d-flex justify-content-end gap-2">
            <a href="{% url 'cashbook_summary' %}" class="btn btn-light border">Cancel</a>
            <button type="submit" class="btn btn-warning text-dark fw-bold px-4">
              <i class="fas fa-save me-1"></i> Save Expense
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
